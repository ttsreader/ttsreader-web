<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <link rel="shortcut icon" href="https://ttsreader.com/favicon.ico" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>TTSReader Playback</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            z-index: 1000;
        }

        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        iframe {
            display: none;
            border: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
<div id="loader"></div>
<iframe id="exportFrame"></iframe>
<div onclick="onClose()" style="background-color: whitesmoke; cursor: pointer; position: fixed;padding: 10px;top: 10px;right: 10px;border-radius: 50%; border: 2px solid gray; color: darkslategrey"><svg style="vertical-align: middle;" xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="3"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-x"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg></div>

<script>
    function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        return {
            onClose: params.get('onClose'),
            url: params.get('url'),
            voice: params.get('voice'),
            rate: parseFloat(params.get('rate')),
            date: parseInt(params.get('date')),
            itemId: params.get('itemId') || '',
            startAtMs: parseInt(params.get('startAtMs') || '0', 10) || 0
        };
    }

    // --- Discover resume -----------------------------------------------------
    // The embedded player is a built bundle we do not edit, but it is served
    // from this same origin, so its media element is reachable. We seek it once
    // on open and sample its position while it plays; the parent window owns
    // the actual RTDB write. Everything is best-effort — a player that changes
    // shape must degrade to "no resume", never to "no playback".
    function findMediaElement(iframe) {
        try {
            const doc = iframe.contentDocument;
            return doc ? doc.querySelector('audio, video') : null;
        } catch (e) {
            return null;
        }
    }

    // --- Which reports are news --------------------------------------------------
    // The page that opens this player (index.html openRenderedModal) gives each
    // open an id (`openId`) and counts only the latest open's reports: this frame
    // stays loaded after its Close, and its unload report can land after the next
    // open has read the place. And a report is news only when the place moved since
    // the last one — the media played, or the user moved the playhead — from the
    // place the open resumed at: a Close before the one resume seek, or a Close and
    // then an unload, is not a new place.
    function listenNews(startAtMs) {
        const openId = new URLSearchParams(window.location.search).get('openId') || '';
        let resumed = startAtMs <= 0; // the resume seek is done, or none was needed
        let ownSeek = false; // the resume seek is on its way: its 'seeked' is not the user's
        let played = false; // since the last report, from the resumed place
        let lastAt = null; // the last report's place, in whole seconds
        return {
            openId,
            seeking() {
                ownSeek = true;
            },
            resumed(media) {
                resumed = true;
                if (media && !media.paused) played = true; // the seek landed while playing: no new 'playing' fires
            },
            playing() {
                if (resumed) played = true;
            },
            seeked() {
                if (ownSeek) {
                    ownSeek = false;
                    return;
                }
                if (resumed) played = true; // the user moved it (a drag, a word tapped)
            },
            worth(media, why) {
                if (why === 'pause' && media.ended) return false; // the end: its 'ended' follows, and reports it
                if (!played) return false;
                const at = Math.floor(media.currentTime || 0);
                if (at === lastAt) return false; // the same place again (a Close, then the pause it makes)
                lastAt = at;
                played = !media.paused; // still playing (a Close does not pause an export): what it plays next is news
                return true;
            }
        };
    }

    function trackListenPosition(iframe, itemId, startAtMs) {
        if (!itemId) return;
        let bound = false;
        let seeked = startAtMs <= 0;
        // Null when it fails: then every stop reports, as before it.
        let news = null;
        try {
            news = listenNews(startAtMs);
        } catch (e) {
            news = null;
        }

        const report = (media, why) => {
            let tail = [];
            try {
                if (news) {
                    if (!news.worth(media, why)) return;
                    tail = [news.openId, why];
                }
            } catch (e) {
                tail = [];
            }
            try {
                if (window.parent && window.parent.noteListenPosition) {
                    window.parent.noteListenPosition(
                        itemId, Math.round((media.currentTime || 0) * 1000), media.duration || 0, ...tail);
                }
            } catch (e) {
            }
        };

        // The bookmark is pushed when playback STOPS — pause, end, or the
        // player closing. Never on a timer: a moving playhead is not news, and
        // a per-few-seconds writer is pure chatter on a shared node.
        const bind = (media) => {
            bound = true;
            media.addEventListener('pause', () => report(media, 'pause'));
            media.addEventListener('ended', () => report(media, 'ended'));
            try {
                if (news) {
                    media.addEventListener('playing', () => news.playing());
                    media.addEventListener('seeked', () => news.seeked());
                    // Already playing: its 'playing' came before this bound (a LibriVox chapter starts itself on a
                    // faster poll than this one).
                    if (!media.paused) news.playing();
                }
            } catch (e) {
            }
            const flush = () => report(media, 'unload');
            window.addEventListener('pagehide', flush);
            window.addEventListener('beforeunload', flush);
            const priorOnClose = window.onClose;
            window.onClose = function () {
                report(media, 'close');
                if (priorOnClose) priorOnClose();
            };
        };

        // The only polling is the short wait for the built player to mount its
        // media element; it stops as soon as we are bound and seeked.
        const wait = setInterval(() => {
            const media = findMediaElement(iframe);
            if (!media) return;
            if (!bound) bind(media);
            if (!seeked && media.readyState >= 1 && media.duration > 0) {
                // One seek only: after this the user owns the playhead.
                seeked = true;
                try {
                    if (news) news.seeking();
                } catch (e) {
                }
                try {
                    media.currentTime = Math.min(startAtMs / 1000, Math.max(0, media.duration - 1));
                } catch (e) {
                }
                try {
                    if (news) news.resumed(media);
                } catch (e) {
                }
            }
            if (bound && seeked) clearInterval(wait);
        }, 500);
        setTimeout(() => clearInterval(wait), 30000);
        // The seek waits only as long as the poll: after that the user owns the playhead, wherever it is.
        setTimeout(() => {
            try {
                if (news && !seeked) news.resumed(findMediaElement(iframe));
            } catch (e) {
            }
        }, 30000);
    }

    // Discover content ships mp3 + srt + jpg siblings and has NO .sentence.json
    // (the contract lives in core/discover/DiscoverContent.kt). Without this
    // parser every Discover item played with a single placeholder caption
    // instead of its transcript. Same {Text, AudioOffset, Duration} shape the
    // export pipeline emits, so jsonToCaptions is untouched.
    function srtToJson(srt) {
        const toMs = (stamp) => {
            const m = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})/.exec(stamp);
            if (!m) return null;
            return ((+m[1] * 60 + +m[2]) * 60 + +m[3]) * 1000 + +m[4].padEnd(3, "0");
        };
        const out = [];
        for (const block of srt.replace(/\r/g, "").split(/\n{2,}/)) {
            const lines = block.split("\n").filter((l) => l.trim());
            if (lines.length < 2) continue;
            const timing = lines.find((l) => l.indexOf("-->") !== -1);
            if (!timing) continue;
            const [rawStart, rawEnd] = timing.split("-->");
            const start = toMs(rawStart || "");
            const end = toMs(rawEnd || "");
            if (start === null || end === null) continue;
            const text = lines.slice(lines.indexOf(timing) + 1).join(" ").trim();
            if (text) out.push({Text: text, AudioOffset: start, Duration: Math.max(0, end - start)});
        }
        return out;
    }

    function jsonToCaptions(json) {
        return json.map(entry => {
            const startSec = entry.AudioOffset / 1000;
            const endSec = (entry.AudioOffset + entry.Duration) / 1000;
            return [entry.Text, parseFloat(startSec.toFixed(2)), parseFloat(endSec.toFixed(2)), 0];
        });
    }

    // --- LibriVox listen (Discover search, src/discover/search/LibrivoxListen.js) ---
    // Active ONLY when the page is opened with `listen=<id>`, which no other caller
    // sends; every call into it below is wrapped, so a failure here leaves the
    // page as it was. A LibriVox chapter streams from archive.org, which has no
    // captions beside the mp3: the caller says where they are (`listenSrt`, the
    // "Read along" captions, or empty for none) and what to show without them
    // (`listenTitle`). `listenAutoplay=1` starts the chapter once the player has
    // mounted; its end is reported to the parent (noteListenEnded), which opens
    // the next chapter. Close pauses it and tells the parent (noteListenClosed),
    // so a closed player never moves on.
    const LISTEN_CAPTIONS_TIMEOUT_MS = 6000;

    function readListenParams() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('listen');
        if (!id) return null;
        const srt = params.get('listenSrt') || '';
        return {
            id,
            srt: /^https?:\/\//.test(srt) ? srt : '',
            title: params.get('listenTitle') || '',
            autoplay: params.get('listenAutoplay') === '1',
            // An album chapter whose captions sit beside its mp3 (a Discover audiobook's narrated exports): they are
            // looked up there exactly as for an ordinary open. A LibriVox chapter never sends it.
            beside: params.get('listenCaptions') === 'beside'
        };
    }

    async function loadListenCaptions(listen, placeholder) {
        const titleOnly = listen.title ? [{ Text: listen.title, AudioOffset: 0, Duration: 0 }] : placeholder;
        if (!listen.srt) return titleOnly;
        const ac = typeof AbortController === 'function' ? new AbortController() : null;
        let timer = null;
        const deadline = new Promise((resolve) => {
            timer = setTimeout(() => {
                try {
                    if (ac) ac.abort();
                } catch (e) {
                }
                resolve(null);
            }, LISTEN_CAPTIONS_TIMEOUT_MS);
        });
        try {
            const response = await Promise.race([fetch(listen.srt, ac ? { signal: ac.signal } : undefined), deadline]);
            if (!response) throw new Error("timeout");
            if (!response.ok) throw new Error("http " + response.status);
            const text = await Promise.race([response.text(), deadline]);
            if (text === null) throw new Error("timeout");
            const parsed = srtToJson(text);
            return parsed.length ? parsed : titleOnly;
        } catch (e) {
            console.warn("LibriVox listen: no captions for this chapter", e);
            return titleOnly;
        } finally {
            clearTimeout(timer);
        }
    }

    function startListen(listen) {
        let closed = false;
        let media = null;
        const priorOnClose = window.onClose;
        window.onClose = function () {
            closed = true;
            try {
                if (media) media.pause();
            } catch (e) {
            }
            try {
                if (window.parent && window.parent.noteListenClosed) window.parent.noteListenClosed(listen.id);
            } catch (e) {
            }
            if (priorOnClose) priorOnClose();
        };
        return {
            attach(iframe) {
                let started = !listen.autoplay;
                const wait = setInterval(() => {
                    if (closed) {
                        clearInterval(wait);
                        return;
                    }
                    const found = findMediaElement(iframe);
                    if (!found) return;
                    clearInterval(wait);
                    media = found;
                    media.addEventListener('ended', () => {
                        if (closed) return;
                        try {
                            if (window.parent && window.parent.noteListenEnded) window.parent.noteListenEnded(listen.id);
                        } catch (e) {
                        }
                    });
                    if (!started) {
                        started = true;
                        try {
                            const playing = media.play();
                            if (playing && playing.catch) playing.catch(() => {});
                        } catch (e) {
                        }
                    }
                }, 250);
                setTimeout(() => clearInterval(wait), 30000);
            }
        };
    }

    async function main() {
        const { url, voice, rate, date, onClose, lang, itemId, startAtMs } = getQueryParams();
        if (!url) return alert("Missing URL parameter");

        if (onClose) {
            window.onClose = () => {
                window.parent[onClose]();
            };
        }
        // Close pauses what plays (Ronen, 2026-10-13: "Close pauses every item, as LibriVox does"). The modal only
        // hides this page, so without it an export or a Discover item played on under the closed player. The media is
        // looked up at the Close itself: whatever is mounted then is what is playing. Wrapped: the modal closes
        // whatever happens here.
        try {
            const closeModal = window.onClose;
            if (closeModal) {
                window.onClose = () => {
                    try {
                        const media = findMediaElement(document.getElementById("exportFrame"));
                        if (media) media.pause();
                    } catch (e) {
                    }
                    closeModal();
                };
            }
        } catch (e) {
        }

        // A LibriVox listen only (see "LibriVox listen" above); null for every other caller.
        let listen = null;
        let listenSession = null;
        try {
            listen = readListenParams();
            if (listen) listenSession = startListen(listen);
        } catch (e) {
            console.warn("LibriVox listen: not started", e);
        }

        let json = [{ Text: "No json created as HD voices were used, which do not support that feature yet.", AudioOffset: 0, Duration: 0}];
        if (listen && !listen.beside) {
            try {
                json = await loadListenCaptions(listen, json);
            } catch (e) {
                console.warn("LibriVox listen: captions", e);
            }
        } else {
        try {
            const response = await fetch(url + ".sentence.json");
            if (!response.ok) throw new Error("http " + response.status);
            json = await response.json();
        } catch (err) {
            // Rendered exports have .sentence.json; Discover items have .srt.
            try {
                const srtResponse = await fetch(url + ".srt");
                if (!srtResponse.ok) throw new Error("http " + srtResponse.status);
                const parsed = srtToJson(await srtResponse.text());
                if (parsed.length) json = parsed;
            } catch (srtErr) {
                console.error("Error loading captions (neither .sentence.json nor .srt):", err, srtErr);
            }
        }
        }

            let code = url.replace("https://ttsreaderstorage.blob.core.windows.net/tts-outputs/","").split("/")[0];

            window.videoDetails = {
                id: 0,
                voice,
                rate,
                orderedAt: date,
                title: "",
                speakers: 1,
                fileName: "",
                url: url + ".mp3",
                duration: "",
                description: "",
                caps: jsonToCaptions(json),
                directLink: `https://ttsreader.com/rendered/?c=${code}&lang=${lang}&voice=${voice}&rate=${rate}&date=${date}`
            };

            const iframe = document.getElementById("exportFrame");
            iframe.onload = () => {
                document.getElementById("loader").style.display = "none";
                iframe.style.display = "block";
                trackListenPosition(iframe, itemId, startAtMs);
                try {
                    if (listenSession) listenSession.attach(iframe);
                } catch (e) {
                    console.warn("LibriVox listen: not attached", e);
                }
            };

            iframe.src = "embedded/embeddedPlayback/";
    }

    main();
</script>
</body>
</html>
