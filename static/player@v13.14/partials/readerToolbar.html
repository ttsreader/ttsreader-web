      <div class="Buttons-bar" style="display: flex">

        <!-- Add Content Dropdown -->
        &nbsp;
        <button class="Hide-on-narrow-screens" style="align-content: center; position: relative; cursor: pointer;">
          <svg class="Top-btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
            <path d="M14.5 2H6a2 2 0 0 0 -2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
            <polyline points="14,2 14,8 20,8"/>
          </svg>
          <input class="add-content-file-input" type="file" accept=".csv, .json, .txt, .rtf, .pdf, .epub, .docx, .html, .htm" data-ws-onChange="handleFileSelect" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;">
        </button>
        <span class="Hide-on-narrow-screens">&nbsp;</span>

        <button data-ws-toggle="#openUrlModal"  class="Hide-on-narrow-screens btn btn-link" type="button" aria-label="<%= htmlWebpackPlugin.options.strings.d20260220_index_import_website %>" title="<%= htmlWebpackPlugin.options.strings.d20260220_index_import_website %>">
          <svg class="Top-btn-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.5 7a9 9 0 0 0-7.5-4a8.991 8.991 0 0 0-7.484 4"/>
            <path d="M11.5 3a16.989 16.989 0 0 0-1.826 4"/>
            <path d="M12.5 3a16.989 16.989 0 0 1 1.828 4"/>
            <path d="M19.5 17a9 9 0 0 1-7.5 4a8.991 8.991 0 0 1-7.484-4"/>
            <path d="M11.5 21a16.989 16.989 0 0 1-1.826-4"/>
            <path d="M12.5 21a16.989 16.989 0 0 0 1.828-4"/>
            <path d="M2 10l1 4l1.5-4l1.5 4l1-4"/>
            <path d="M17 10l1 4l1.5-4l1.5 4l1-4"/>
            <path d="M9.5 10l1 4l1.5-4l1.5 4l1-4"/>
          </svg>
        </button>

        <button style="margin: 0 8px;" data-ws-onClick="openBooksModal" class="Hide-on-narrow-screens btn btn-link toolbar-books-btn" type="button" aria-label="<%= htmlWebpackPlugin.options.strings.d20260427_books_modal_title %>" title="<%= htmlWebpackPlugin.options.strings.d20260427_books_modal_title %>">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="Top-btn-svg icon icon-tabler icons-tabler-outline icon-tabler-book"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0" /><path d="M3 6l0 13" /><path d="M12 6l0 13" /><path d="M21 6l0 13" /></svg>
          <!--<sup class="badge-new-sup badge-new-sup&#45;&#45;toolbar">NEW</sup>-->
        </button>

        <span style="display: inline-block;flex: 1"></span>

        <!-- The open document's title owns the toolbar's centre. Clicking it
             drops the recent-documents menu; the pencil swaps the label for an
             input. Both are `data-ws-show-if-state` flips of one state key
             each — nothing here toggles display directly. -->
        <div class="doc-title-wrap">
          <button class="doc-title-btn" data-ws-show-if-state="docTitleEditing=false"
                  data-ws-onclick="docTitleClick"
                  title="<%= htmlWebpackPlugin.options.strings.d20260827_doc_menu_title %>" aria-haspopup="menu">
            <span class="doc-title-text" data-ws-label-state="activeDocTitleLabel"></span>
            <!-- Renaming and the recents menu belong to the Reader; elsewhere the
                 title is just a label that takes you back to it. -->
            <span class="doc-title-pencil"
                  data-ws-onclick="docTitleEdit" title="<%= htmlWebpackPlugin.options.strings.d20260827_doc_rename %>" aria-label="<%= htmlWebpackPlugin.options.strings.d20260827_doc_rename %>">
              <svg class="ws-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4"/><path d="M13.5 6.5l4 4"/></svg>
            </span>
            <svg class="ws-icon doc-title-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6l6 -6"/></svg>
          </button>

          <input id="docTitleInput" class="doc-title-input hidden" type="text"
                 data-ws-show-if-state="docTitleEditing=true"
                 data-ws-value-state="activeDocTitle" data-ws-onchange="docTitleCommit"
                 aria-label="<%= htmlWebpackPlugin.options.strings.d20260827_doc_rename %>">

          <div id="docTitleMenu" class="doc-title-menu hidden" role="menu"
               data-ws-show-if-state="docMenuOpen=true">
            <!-- Making an mp3 OF THIS DOCUMENT comes first: the menu hangs off the
                 document's own title, so the action about that document outranks
                 the one that leaves it. -->
            <button class="doc-menu-item doc-menu-item--generate" data-ws-onclick="docMenuGenerateMp3">
              <svg class="ws-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></svg>
              <span class="doc-menu-item-title"><%= htmlWebpackPlugin.options.strings.d20260827_doc_menu_generate_mp3 %></span>
            </button>
            <button class="doc-menu-item doc-menu-item--new" data-ws-onclick="docMenuNew">
              <svg class="ws-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l0 14"/><path d="M5 12l14 0"/></svg>
              <span class="doc-menu-item-title"><%= htmlWebpackPlugin.options.strings.d20260827_new_title %></span>
            </button>
            <div class="doc-menu-heading"><%= htmlWebpackPlugin.options.strings.d20260827_doc_recent %></div>
            <div id="docMenuList" class="doc-menu-list"></div>
          </div>
        </div>

        <!-- Stats and "make an mp3" sit WITH the title: both act on the document
             named beside them, not on the app. Grouped so they read as one
             control rather than two loose icons. The export button opens the
             export modal DIRECTLY — the archive of finished files is its own
             rail item now. -->
        <!--<span class="title-actions">
          <button class="title-action" data-ws-onclick="calculateStats" data-ws-toggle="#statsModal"
                  title="Text analytics - word counter &amp; more" aria-label="Text analytics - word counter &amp; more">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-google-analytics"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M10 9m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v9.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" /><path d="M17 3m0 1.105a1.105 1.105 0 0 1 1.105 -1.105h1.79a1.105 1.105 0 0 1 1.105 1.105v15.79a1.105 1.105 0 0 1 -1.105 1.105h-1.79a1.105 1.105 0 0 1 -1.105 -1.105z" /><path d="M5 19m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /></svg>
          </button>
          <button class="title-action" data-ws-onclick="calculateStats" data-ws-toggle="#exportModal"
                  title="<%= htmlWebpackPlugin.options.strings.d20260220_index_export_text_to_mp3 %>" aria-label="<%= htmlWebpackPlugin.options.strings.d20260220_index_export_text_to_mp3 %>">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2"/><path d="M7 11l5 5l5 -5"/><path d="M12 4l0 12"/></svg>
          </button>
        </span>-->


        <!-- Reader-only actions: exports, theme, stats, help, player settings.
             They act on the document being read, so on any other tab they are
             noise pointing at nothing. One state key, no per-button logic. -->
        <!-- Everything that acts ON this document, in one place (the port of iOS's
             ellipsis menu). Rendered by DocActionsMenu; the rows reuse the Library's
             own handlers so an action behaves the same wherever you reach it. -->
        <div class="doc-actions-wrap">
          <button class="doc-actions-btn" data-ws-onclick="docActionsClick" aria-haspopup="menu"
                  title="<%= htmlWebpackPlugin.options.strings.d20260802_document_actions %>" aria-label="<%= htmlWebpackPlugin.options.strings.d20260802_document_actions %>">
            <svg class="ws-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/><path d="M19 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/></svg>
          </button>
          <div id="docActionsMenu" class="doc-title-menu doc-actions-menu hidden" role="menu"
               data-ws-show-if-state="docActionsOpen=true">
            <div id="docActionsList" class="doc-menu-list"></div>
          </div>
        </div>

          <span style="flex: 1"></span>

        <div class="toolbar-actions">
        <!--<button data-ws-show-if-state="isPremium=false" class="Hide-on-narrow-screens" style="text-align: center; text-wrap:nowrap;" onclick="openNewUpgradeModal()">
          <span style="border-radius: 10px; padding: 7px 16px; background-color: green; font-weight: bold;">👑 <%= htmlWebpackPlugin.options.strings.go_premium %></span>
        </button>-->
        <!-- The voice, at a glance: the player pill's own gender + locale pair,
             hoisted into the toolbar so the current voice is readable without
             the sidebar. It IS the closed sidebar's stand-in — `showSettingsSidebar`
             is the same derived key the sidebar itself binds to, so the two can
             never both be on screen, and clicking here runs the pill's own
             handler rather than a second way to open the same panel. -->
        <button class="btn btn-link toolbar-voice-btn" type="button"
                data-ws-show-if-state="showSettingsSidebar=false"
                data-ws-onclick="voiceChipClick"
                title="<%= htmlWebpackPlugin.options.strings.d20260827_chip_voice %>" aria-label="<%= htmlWebpackPlugin.options.strings.d20260827_chip_voice %>">
          <span class="chip-gender hidden" data-ws-show-if-state="voiceIsFemale=true">👩</span>
          <span class="chip-gender hidden" data-ws-show-if-state="voiceIsMale=true">👨</span>
          <span class="chip-gender hidden" data-ws-show-if-state="voiceIsNeutral=true">🧑</span>
          <span class="toolbar-voice-flag Flag-font" data-ws-label-state="voiceFlag"></span>
        </button>

        <span class="Hide-on-narrow-screens">&nbsp;</span>
        <button onclick="toggleTheme();" class="btn btn-link" type="button" aria-label="Toggle user interface mode">
          <span class="toggle-dark"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-moon"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg></span><span class="toggle-light"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentcolor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-sun"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
        </button>
        </div>
        <!--<button title="Interface Language Selector" aria-label="Interface Language Selector" style="" data-ws-toggle="#interfaceLangModal">
          <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-language"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 5h7" /><path d="M9 3v2c0 4.418 -2.239 8 -5 8" /><path d="M5 9c0 2.144 2.952 3.908 6.7 4" /><path d="M12 20l4 -9l4 9" /><path d="M19.1 18h-6.2" /></svg>
        </button>-->
      </div>
