<div class="tab-page">
  <div data-ws-show-if-state="showLibraryDocs=true">

    <!-- The page, top to bottom (Ronen, 2026-11-17: "the recents title row should be at the top. The search right under
         it. then the explanatory text"): the title row, the search, the note, the list.

         On the title row's far end, the audio the person made from their own texts, as a button of its own (Ronen:
         "the link to 'your generated audio files' is not placed well, not prominent and unique enough ... it should
         probably be a distinct button rather than a 'tab' that it's not"). It opens the same list the menu's Generated
         audio opens. Where it stands is my choice: Ronen had not decided ("IDK where to place [it]"). -->
    <div class="library-toolbar library-top">
      <h2 class="tab-page-title library-recents-title"><%= htmlWebpackPlugin.options.strings.d20260828_library_recents_title %></h2>
      <button type="button" class="library-audio-door" onclick="openOrCloseExportsListModal()"
              title="<%= htmlWebpackPlugin.options.strings.d20261117_library_audio_door_sub %>">
        <svg class="ws-icon library-audio-door-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><path d="M4 13v4a2 2 0 0 0 2 2h1v-7h-1a2 2 0 0 0 -2 2"/><path d="M20 13v4a2 2 0 0 1 -2 2h-1v-7h1a2 2 0 0 1 2 2"/></svg>
        <span class="library-audio-door-title"><%= htmlWebpackPlugin.options.strings.drawer__mp3_exports_list %></span>
        <svg class="ws-icon library-audio-door-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>
      </button>
    </div>

    <!-- Same pill as Discover's, and sticky for the same reason: a long shelf
         scrolls under it and the way to filter it stays reachable. -->
    <input class="library-search-input search-pill" type="search"
           placeholder="<%= htmlWebpackPlugin.options.strings.d20260826_library_search %>"
           data-ws-oninput="librarySearchInput">

    <!-- The note belongs to the documents: they live in the browser's storage, which the browser is free to clear. -->
    <p class="library-recents-note"><%= htmlWebpackPlugin.options.strings.d20260828_library_recents_note %></p>

    <!-- ONE list of what the person reads and listens to: their documents, and the audiobooks and recordings their
         account has played, in one order (Ronen, 2026-11-17: "recents should merge both documents as well as what is
         now in 'keep listening' - user does not and should not differentiate"; src/library/LibraryRecents.js).
         Its order is its own control, on its own line at the list's trailing edge. -->
    <div class="library-sortline">
      <select class="library-sort-select" data-ws-onchange="librarySortChange"
              aria-label="<%= htmlWebpackPlugin.options.strings.d20260826_library_sort_recent %>">
        <option value="recentlyViewed"><%= htmlWebpackPlugin.options.strings.d20260826_library_sort_recent %></option>
        <option value="dateNewest"><%= htmlWebpackPlugin.options.strings.d20260826_library_sort_created %></option>
        <option value="titleAZ"><%= htmlWebpackPlugin.options.strings.d20260826_library_sort_title %></option>
      </select>
    </div>

    <div id="libraryDocsList" class="library-docs-list"></div>
    <p id="libraryEmptyState" class="tab-page-placeholder"><%= htmlWebpackPlugin.options.strings.d20260826_library_placeholder %></p>
  </div>
</div>
