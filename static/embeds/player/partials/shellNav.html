<!-- The app's menu (docs/design/APP-SHELL-PLAN.md, option B; Ronen, 2026-11-17: "[B · Tabs in the top bar, floating
     buttons] as well as the Phone's mockup are AMAZING! do it!").
     A wide window: Add and the things that open over the page float over the page's left edge. The three pages are a
     selector in the page's top bar (readerToolbar.html, shellTopBar.html).
     A phone (html.bottom-bar, src/shell/ShellLayout.js): a bar at the foot of the screen with the three pages, Add in
     its middle, and More for the things that open.
     Add opens the New document window as a menu beside it under the mouse, and as a sheet on a press
     (src/shell/ShellNav.js). -->
        <div class="sn-float">

            <button type="button" class="sn-tool sn-tool--voices" data-ws-onclick="openVoices" aria-label="<%= htmlWebpackPlugin.options.strings.d20261115_vg_title || 'Voices' %>"><svg class="sn-ic sn-ic--fill" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="9" cy="9" r="4"/><path d="M9 15c-2.67 0-8 1.34-8 4v2h16v-2c0-2.660-5.330-4-8-4zm7.760-9.640l-1.680 1.690c.840 1.180.840 2.710 0 3.890l1.680 1.690c2.020-2.020 2.020-5.070 0-7.270zM20.070 2l-1.630 1.630c2.770 3.020 2.770 7.560 0 10.740L20.070 16c3.900-3.890 3.910-9.950 0-14z"/></svg><span class="sn-tip" aria-hidden="true"><%= htmlWebpackPlugin.options.strings.d20261115_vg_title || 'Voices' %></span></button>

            <button type="button" class="sn-tool sn-tool--about" data-ws-onclick="shellWindowOpen" data-window="about" aria-haspopup="dialog" aria-label="<%= htmlWebpackPlugin.options.strings.d20260826_tab_about %>"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg><span class="sn-tip" aria-hidden="true"><%= htmlWebpackPlugin.options.strings.d20260826_tab_about %></span></button>

          <button type="button" class="sn-tab sn-bar-item" data-ws-onclick="switchTab" data-tab="reader" title="<%= htmlWebpackPlugin.options.strings.d20260826_tab_reader %>"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M7 4v16l13 -8z" /></svg><span class="sn-tab-label"><%= htmlWebpackPlugin.options.strings.d20260826_tab_reader %></span></button>

          <button type="button" class="sn-tab sn-bar-item" data-ws-onclick="switchTab" data-tab="discover" title="<%= htmlWebpackPlugin.options.strings.d20260826_tab_discover %>"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M8 16l2 -6l6 -2l-2 6l-6 2" /><path d="M12 12m-9 0a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" /><path d="M12 3l0 2" /><path d="M12 19l0 2" /><path d="M3 12l2 0" /><path d="M19 12l2 0" /></svg><span class="sn-tab-label"><%= htmlWebpackPlugin.options.strings.d20260826_tab_discover %></span></button>
          <button type="button" class="sn-bar-item sn-bar-more" data-ws-onclick="shellMoreToggle" aria-haspopup="dialog" aria-controls="shellMore" aria-expanded="false" title="<%= htmlWebpackPlugin.options.strings.d20261117_shell_more %>"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/></svg><span class="sn-badge hidden" data-ws-show-if-state="bgTasksBusy=true" data-ws-label-state="bgTasksBadgeLabel"></span><span class="sn-tab-label"><%= htmlWebpackPlugin.options.strings.d20261117_shell_more %></span></button>
        </nav>

        <div id="shellMore" class="sn-more hidden" data-ws-show-if-state="shellMoreOpen=true">
          <button type="button" class="sn-more-scrim" data-ws-onclick="shellMoreClose" aria-label="<%= htmlWebpackPlugin.options.strings.d20261008_close %>" tabindex="-1"></button>
          <div class="sn-more-sheet" role="dialog" aria-modal="true" aria-label="<%= htmlWebpackPlugin.options.strings.d20261117_shell_more %>">
            <div class="sn-more-grab" aria-hidden="true"></div>
            <div class="sn-more-head">
              <span class="sn-more-title"><%= htmlWebpackPlugin.options.strings.d20261117_shell_more %></span>
              <button type="button" class="sn-more-close" data-ws-onclick="shellMoreClose" aria-label="<%= htmlWebpackPlugin.options.strings.d20261008_close %>"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></svg></button>
            </div>
            <button type="button" class="sn-more-row sn-more-row--voices" data-ws-onclick="openVoices"><span class="sn-more-icon"><svg class="sn-ic sn-ic--fill" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><circle cx="9" cy="9" r="4"/><path d="M9 15c-2.67 0-8 1.34-8 4v2h16v-2c0-2.660-5.330-4-8-4zm7.760-9.640l-1.680 1.690c.840 1.180.840 2.710 0 3.890l1.680 1.690c2.020-2.020 2.020-5.070 0-7.270zM20.070 2l-1.630 1.630c2.770 3.020 2.770 7.560 0 10.740L20.070 16c3.900-3.890 3.910-9.950 0-14z"/></svg></span><span class="sn-more-label"><%= htmlWebpackPlugin.options.strings.d20261115_vg_title || 'Voices' %></span></button>
            <button type="button" class="sn-more-row sn-more-row--exports" onclick="openOrCloseExportsListModal()"><span class="sn-more-icon"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /><path d="M7 11l5 5l5 -5" /><path d="M12 4l0 12" /></svg></span><span class="sn-more-label"><%= htmlWebpackPlugin.options.strings.d20260827_rail_generated_audio %></span></button>

            <button type="button" class="sn-more-row sn-more-row--prefs" data-ws-onclick="openPreferences"><span class="sn-more-icon"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M14 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M4 6l8 0" /><path d="M16 6l4 0" /><path d="M8 12m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M4 12l2 0" /><path d="M10 12l10 0" /><path d="M17 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M4 18l11 0" /><path d="M19 18l1 0" /></svg></span><span class="sn-more-label"><%= htmlWebpackPlugin.options.strings.d20260826_tab_prefs %></span></button>
            <button type="button" class="sn-more-row sn-more-row--account" data-account-menu data-ws-onclick="accountMenuToggle" aria-haspopup="dialog" aria-controls="accountMenu"><span class="am-avatar am-avatar--row" data-ws-style-state="backgroundColor=accountAvatarTone" aria-hidden="true"><span class="am-avatar-icon" data-ws-show-if-state="accountAvatarIcon=true"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg></span><span class="am-avatar-initial" data-ws-label-state="accountAvatarInitial"></span><span class="am-avatar-photo" data-ws-style-state="backgroundImage=accountAvatarPhoto"></span></span><span class="sn-more-label"><%= htmlWebpackPlugin.options.strings.d20260826_tab_account %></span><span class="sn-more-who hidden" dir="ltr" data-ws-show-if-state="isSignedIn=true" data-ws-label-state="email"></span></button>
            <button type="button" class="sn-more-row sn-more-row--about" data-ws-onclick="shellWindowOpen" data-window="about" aria-haspopup="dialog"><span class="sn-more-icon"><svg class="sn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M12 9h.01" /><path d="M11 12h1v4h1" /></svg></span><span class="sn-more-label"><%= htmlWebpackPlugin.options.strings.d20260826_tab_about %></span></button>
          </div>
